name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional full master commit SHA to retry (default: current master)'
        required: false
        type: string

# Build processes never receive repository write access.
permissions:
  contents: read

jobs:
  verify:
    name: Verify master and CircleCI
    if: github.repository == 'rogerioth/Inventory_Kamera' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version from first-parent master history
        id: version
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          if [[ ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Specify a full 40-character commit SHA."
            exit 1
          fi
          git fetch --no-tags origin master
          git rev-list --first-parent origin/master > "$RUNNER_TEMP/master-history.txt"
          git show "$RELEASE_COMMIT:release-version.json" > "$RUNNER_TEMP/release-version.json"
          version=$(node ./scripts/release-version.cjs "$RELEASE_COMMIT" "$RUNNER_TEMP/master-history.txt" "$RUNNER_TEMP/release-version.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Wait for the exact master build and quality gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            const { circleBuildNumber, verifyCircleBuild } = require('./scripts/release-policy.cjs');
            const { owner, repo } = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            const requiredContext = 'ci/circleci: Windows build and offline checks';
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              const status = data.statuses.find(item => item.context === requiredContext);
              if (status?.state === 'success') {
                const number = circleBuildNumber(status.target_url, owner, repo);
                const response = await fetch(`https://circleci.com/api/v1.1/project/github/${owner}/${repo}/${number}`);
                if (!response.ok) throw new Error(`CircleCI verification returned HTTP ${response.status}.`);
                verifyCircleBuild(await response.json(), sha, owner, repo);
                core.info(`CircleCI build ${number} validated ${sha}, including the Sonar quality gate.`);
                return;
              }
              if (status && ['failure', 'error'].includes(status.state)) {
                throw new Error('CircleCI failed for this master commit. Fix or rerun CI before retrying the release.');
              }
              core.info(`Waiting for CircleCI (${attempt + 1}/60).`);
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            throw new Error('No successful master CircleCI build appeared within 20 minutes. Rerun after CI finishes.');

  package:
    name: Package Windows x64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Build and verify the distributable
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: .\scripts\build-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: windows-release
          path: |
            artifacts/release/InventoryKamera-win-x64.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/release-metadata.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    # Preserve queued merges; the default single-pending queue drops older runs.
    concurrency:
      group: github-release-publish
      queue: max
    steps:
      # No checkout or execution of application/build code with the write token.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-release
          path: release-assets
      - name: Create or resume the exact-commit release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            const version = process.env.RELEASE_VERSION;
            const tag = `v${version}`;
            if (!/^[a-f0-9]{40}$/.test(sha) || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release identity.');
            // A CI rerun may have changed the result while packaging was running.
            const status = (await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })).data.statuses
              .find(item => item.context === 'ci/circleci: Windows build and offline checks');
            const target = status && new URL(status.target_url);
            const prefix = `/gh/${owner}/${repo}/`;
            if (status?.state !== 'success' || target.origin !== 'https://circleci.com' ||
                !target.pathname.startsWith(prefix) || !/^\d+$/.test(target.pathname.slice(prefix.length))) {
              throw new Error('The exact master commit no longer has a successful CircleCI result.');
            }
            const response = await fetch(`https://circleci.com/api/v1.1/project/github/${owner}/${repo}/${target.pathname.slice(prefix.length)}`);
            if (!response.ok) throw new Error(`CircleCI verification returned HTTP ${response.status}.`);
            const build = await response.json();
            if (build.status !== 'success' || build.branch !== 'master' || build.vcs_revision !== sha ||
                build.username !== owner || build.reponame !== repo || build.pull_requests?.length) {
              throw new Error('CircleCI verification changed before publishing.');
            }
            const names = ['InventoryKamera-win-x64.zip', 'SHA256SUMS.txt', 'release-metadata.json'];
            if (fs.readdirSync('release-assets').sort().join() !== [...names].sort().join()) throw new Error('Unexpected release files.');
            const metadata = JSON.parse(fs.readFileSync('release-assets/release-metadata.json', 'utf8').replace(/^\uFEFF/, ''));
            const archive = fs.readFileSync('release-assets/InventoryKamera-win-x64.zip');
            const digest = crypto.createHash('sha256').update(archive).digest('hex');
            const checksums = fs.readFileSync('release-assets/SHA256SUMS.txt', 'utf8').trim().split(/\r?\n/);
            if (metadata.commit !== sha || metadata.version !== version || metadata.sha256.toLowerCase() !== digest ||
                !checksums.some(line => line.toLowerCase() === `${digest}  inventorykamera-win-x64.zip`)) {
              throw new Error('Artifact version, commit, or SHA256 verification failed.');
            }
            let ref;
            try { ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (ref && (ref.object.type !== 'commit' || ref.object.sha !== sha)) throw new Error('Release tag points to a different commit.');
            if (!ref) await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (release && !release.draft) {
              for (const name of names) {
                if (!release.assets.some(asset => asset.name === name && asset.state === 'uploaded')) {
                  throw new Error('Published release is missing an asset; published assets will not be overwritten.');
                }
              }
              core.info(`Already published: ${release.html_url}`);
              return;
            }
            if (!release) {
              const notes = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag, target_commitish: sha });
              const body = [
                'Download **InventoryKamera-win-x64.zip** below (the Source code archives are for developers).',
                'Extract the entire ZIP to a writable folder, then double-click **Start Inventory Kamera.cmd**. The launcher checks prerequisites and can install the bundled Microsoft Visual C++ x64 runtime. Approve the normal Windows administrator prompt.',
                'Requires Windows 10/11 x64 and .NET Framework 4.7.2 or later. The app is unsigned, so Windows may display SmartScreen. Game lookup tables download on first use.',
                `Built from verified master commit ${sha}. SHA-256 checksums and build metadata are attached.`,
                notes.data.body
              ].join('\n\n');
              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag,
                target_commitish: sha, name: `Inventory Kamera ${version}`, body, draft: true, prerelease: false })).data;
            }
            // A retry may resume a draft. Only unpublished assets may be replaced.
            for (const name of names) {
              const previous = release.assets.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
              const data = fs.readFileSync(`release-assets/${name}`);
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length } });
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] - b[i]; }
              return 0;
            };
            const newer = releases.some(item => !item.draft && !item.prerelease && /^v\d+\.\d+\.\d+$/.test(item.tag_name) &&
              compare(item.tag_name.slice(1).split('.').map(Number), version.split('.').map(Number)) > 0);
            const published = await github.rest.repos.updateRelease({ owner, repo, release_id: release.id,
              draft: false, make_latest: newer ? 'false' : 'true' });
            await core.summary.addHeading(`Released ${tag}`).addLink('Download release', published.data.html_url).write();

  cleanup:
    name: Remove temporary package storage
    needs: [package, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        with:
          script: |
            const artifact_id = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifact_id) || artifact_id <= 0) throw new Error('Invalid temporary artifact ID.');
            try { await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id }); }
            catch (error) { if (error.status !== 404) throw error; }
            core.info('Temporary Actions artifact removed; GitHub Release downloads remain available.');
